name: Vaani NLU CI

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install build & runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++
          python3 -m pip install --upgrade pip
          python3 -m pip install numpy onnxruntime

      - name: Configure and build C++ runtime
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j

      - name: Smoke test CLI binary
        run: |
          LD_LIBRARY_PATH=build ./build/vaani_cli "subah 8 baje ka alarm laga do"

      - name: Run CTest suite
        working-directory: build
        run: ctest --output-on-failure

      - name: Run Python E2E test suite
        run: |
          LD_LIBRARY_PATH=build python3 tests/test_e2e.py
